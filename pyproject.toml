[project]
name = "observatory"
version = "0.1.0"
description = "Territorial data observatory for the Province of Namur"
requires-python = ">=3.11"
dependencies = [
  # dbt-core 1.13 est encore en bêta : on reste sur la 1.12 stable.
  "dbt-core>=1.10,<1.13",
  "dbt-postgres>=1.10,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.6,<3",
  "rapidfuzz>=3,<4",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
observatory = "observatory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: nécessite une base Postgres démarrée (make up)",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
