observatory:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'dbt_rw') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'observatory') }}"
      schema: staging
      threads: 2
      sslmode: disable
