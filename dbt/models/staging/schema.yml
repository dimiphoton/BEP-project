version: 2

models:
  - name: stg_municipality
    description: Population communale, telle que déposée dans raw.
    columns:
      - name: nis_code
        tests:
          - unique
          - not_null
      - name: municipality_name
        tests:
          - not_null
      - name: province_nis_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["90000"]
      - name: population
        tests:
          - not_null
      - name: reference_year
        tests:
          - not_null
