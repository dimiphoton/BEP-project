version: 2

models:
  - name: stg_contract_enterprise
    description: Lien avis-entreprise, tel que déposé dans raw.
    columns:
      - name: notice_id
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - not_null

  - name: stg_public_contract
    description: Avis extraits, tels que déposés dans raw.
    columns:
      - name: notice_id
        tests:
          - unique
          - not_null
      - name: amount_eur
        tests:
          - not_null
      - name: nis_code
        tests:
          - not_null

  - name: stg_municipality
    description: Population communale, telle que déposée dans raw.
    columns:
      - name: nis_code
        tests:
          - unique
          - not_null
      - name: municipality_name
        tests:
          - not_null
      - name: province_nis_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["90000"]
      - name: population
        tests:
          - not_null
      - name: reference_year
        tests:
          - not_null

  - name: stg_enterprise
    description: Entreprises brutes, une ligne par numéro BCE.
    columns:
      - name: enterprise_number
        tests:
          - unique
          - not_null
      - name: enterprise_name
        tests:
          - not_null
      - name: nace_code
        tests:
          - not_null

  - name: stg_establishment
    description: Établissements bruts, grain un site.
    columns:
      - name: establishment_number
        tests:
          - unique
          - not_null
      - name: enterprise_number
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_enterprise')
                field: enterprise_number
      - name: nis_code
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_municipality')
                field: nis_code
      - name: establishment_name
        tests:
          - not_null

  - name: stg_nace_activity
    description: Famille d'activité, une ligne par code NACE.
    columns:
      - name: nace_code
        tests:
          - unique
          - not_null
      - name: activity_family
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - industrie
                  - logistique
                  - commerce
                  - services
                  - construction
                  - autre
      - name: method
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["rule", "ai"]
      - name: confidence
        tests:
          - not_null
