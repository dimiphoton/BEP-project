version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: municipality_population
        description: Population communale chargée par l'ingestion Statbel.
        columns:
          - name: nis_code
            description: Code INS de la commune, clé naturelle.
            tests:
              - unique
              - not_null
      - name: enterprise
        description: Entreprises de l'échantillon synthétique.
        columns:
          - name: enterprise_number
            tests:
              - unique
              - not_null
      - name: establishment
        description: Établissements synthétiques rattachés à une commune.
        columns:
          - name: establishment_number
            tests:
              - unique
              - not_null
          - name: nis_code
            tests:
              - not_null
          - name: enterprise_number
            tests:
              - not_null
      - name: contract_enterprise_link
        description: Décision de lien entre un avis et une entreprise.
        columns:
          - name: notice_id
            tests:
              - unique
              - not_null
          - name: status
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["linked", "review", "unmatched"]
      - name: public_contract
        description: Avis synthétiques extraits par le cache mock.
        columns:
          - name: notice_id
            tests:
              - unique
              - not_null
          - name: amount_eur
            tests:
              - not_null
          - name: nis_code
            tests:
              - not_null
      - name: nace_activity
        description: Famille d'activité d'un code NACE, règle ou cache mock.
        columns:
          - name: nace_code
            tests:
              - unique
              - not_null
          - name: activity_family
            tests:
              - not_null
