version: 2

models:
  - name: dim_municipality
    description: Communes de la province de Namur et leur population.
    columns:
      - name: nis_code
        tests:
          - unique
          - not_null
      - name: municipality_name
        tests:
          - not_null
      - name: province_nis_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["90000"]
      - name: population
        tests:
          - not_null
      - name: reference_year
        tests:
          - not_null

  - name: dim_enterprise
    description: Entreprises de l'échantillon synthétique.
    columns:
      - name: enterprise_number
        tests:
          - unique
          - not_null
      - name: enterprise_name
        tests:
          - not_null
      - name: nace_code
        tests:
          - not_null
      - name: activity_family
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - industrie
                  - logistique
                  - commerce
                  - services
                  - construction
                  - autre
      - name: classification_method
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["rule", "ai"]
      - name: classification_confidence
        tests:
          - not_null

  - name: fact_establishment
    description: Établissements rattachés à une commune et à une entreprise.
    columns:
      - name: establishment_number
        tests:
          - unique
          - not_null
      - name: enterprise_number
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_enterprise')
                field: enterprise_number
      - name: nis_code
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipality')
                field: nis_code
      - name: establishment_name
        tests:
          - not_null
