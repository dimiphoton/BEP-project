name: ci

# Postgres vient de docker compose, pas d'un service nu : le script
# d'init crée les schémas et les rôles. AI_MODE=mock évite toute clé.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AI_MODE: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts

      - name: Ingest, dbt, tests, mock eval, healthcheck
        run: |
          make up
          make ingest
          make build
          make test
          make eval-nace
          make eval-contracts
          make healthcheck
